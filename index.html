<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0a14">
<title>単語チェック</title>
<!--
  単語チェック（宿題の単語アプリ）
  - 期間の QR（?s=<期間ID>、7 文字目が p）：日の一覧 → 単語だけ見て答える → タップで訳 → ○／✕ → 何周でも。
    FSRS（2026-09-15 本人希望）で 1 語ごとの覚えている強さを持ち、忘れそうな語を毎日「復習」に最大 50 語出す。
    評価は ○＝Good・✕＝Again の 2 択。その日の最初の 1 回だけが FSRS に効く（同じ日の周回は練習）。
  - 紙の QR（?s=<シートID>、7 文字目が e/k）：紙の宿題の答え合わせのあとに誤答を入れる（前からの形）。
  演出（本人希望）：XP・倍率・ヒットストップ・画面の揺れ・集中線・FEVER。紙吹雪のファンファーレはやめた。
  このページには単語も氏名も入っていない。データは暗号化して d/<ID>.txt、鍵は URL の # の後ろ。
-->
<style>
:root{--tc:#2ee6c5;--bg:#0b0a14;--ink:#f4f3ff;--sub:#a3a0c2;--ok:#27e39a;--ng:#ff3d71;--a1:#ff4fd8;--a2:#ffb400;--a3:#5b8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:var(--bg);overscroll-behavior:none;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-2;
 background:radial-gradient(40% 35% at 15% 10%,rgba(255,79,216,.35),transparent 70%),radial-gradient(45% 40% at 90% 25%,rgba(91,140,255,.30),transparent 70%),radial-gradient(50% 45% at 50% 100%,rgba(255,180,0,.22),transparent 70%);
 animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) rotate(8deg)}}
button{font-family:inherit}

header{padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#back{display:none;border:0;background:rgba(255,255,255,.1);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800}
#title{flex:1;font-size:14px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}

/* 進み具合：覚えてた＝緑インクが左から、ミス＝ピンクインクが右から */
#inkWrap{display:none}
.ink{position:relative;height:16px;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.08)}
.ink>div{position:absolute;top:0;bottom:0;width:0;transition:width .38s cubic-bezier(.2,1.5,.3,1)}
#inkOk{left:0;border-radius:99px 0 0 99px;background:linear-gradient(90deg,#10b877,#27e39a);box-shadow:0 0 14px rgba(39,227,154,.55)}
#inkNg{right:0;border-radius:0 99px 99px 0;background:linear-gradient(270deg,#e8266a,#ff4fd8);box-shadow:0 0 14px rgba(255,61,113,.55)}
.ink>div:after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:46% 54% 42% 58%}
#inkOk:after{right:-9px;background:#27e39a}#inkNg:after{left:-9px;background:#ff4fd8}
.ink>div.empty:after{display:none}
.splat{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;animation:splat .55s ease-out forwards}
@keyframes splat{0%{transform:translate(0,0) scale(1.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.inkNums{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;font-weight:900;font-style:italic;letter-spacing:.06em}
#nOk{color:#27e39a}#nNg{color:#ff4fd8}

#msg{display:none;text-align:center;font-size:18px;font-weight:700;padding:80px 24px;color:var(--sub)}

/* 日の一覧 */
#hub{display:none;padding:8px 18px 40px}
.hubHead{margin:6px 0 14px}
.hubHead .big{font-size:30px;font-weight:900;line-height:1.1;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.hubHead .small{margin-top:6px;font-size:13px;font-weight:700;color:var(--sub)}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.06)}
.stat .k{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.08em}
.stat .v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.review{display:block;width:100%;border:0;text-align:left;color:#fff;border-radius:20px;padding:16px;margin-bottom:14px;
 background:linear-gradient(120deg,#5b2cff,#ff4fd8 60%,#ffb400);box-shadow:0 14px 34px rgba(255,79,216,.35);position:relative;overflow:hidden}
.review:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.review .k{font-size:12px;font-weight:900;letter-spacing:.14em;opacity:.9}
.review .v{font-size:26px;font-weight:900;margin-top:2px}
.review .s{font-size:12px;font-weight:700;opacity:.85;margin-top:2px}
.review.none{background:rgba(255,255,255,.06);box-shadow:none;color:var(--sub)}
.review.none:after{display:none}
.day{border-radius:20px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.08)}
.day.today{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1),0 10px 30px rgba(255,79,216,.2)}
.dayTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dayName{font-size:17px;font-weight:900}
.badge{font-size:11px;font-weight:900;letter-spacing:.1em;color:#fff;padding:3px 10px;background:var(--a1);clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
.books{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk{border:0;border-radius:14px;padding:12px;text-align:left;color:var(--ink);background:rgba(255,255,255,.08)}
.bk .bn{font-size:13px;font-weight:800;color:var(--sub)}
.bk .bs{margin-top:4px;font-size:18px;font-weight:900;white-space:nowrap}
.bk .br{margin-top:2px;font-size:12px;font-weight:800;color:var(--sub)}
.bk.done{background:linear-gradient(135deg,rgba(39,227,154,.28),rgba(91,140,255,.18))}
.bk.done .bs{color:#27e39a}
.bk.part{background:linear-gradient(135deg,rgba(255,180,0,.22),rgba(255,79,216,.15))}

/* カード */
#swipe{display:none;flex-direction:column;align-items:center;padding:4px 18px 24px;position:relative}
#swipe.quake{animation:quake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
.hud{width:100%;max-width:380px;display:flex;align-items:center;justify-content:space-between;height:28px;gap:8px}
.ticks{display:flex;gap:5px}
.tick{width:22px;height:10px;background:rgba(255,255,255,.12);clip-path:polygon(28% 0,100% 0,72% 100%,0 100%);transition:background .2s}
.tick.on{background:var(--tc);box-shadow:0 0 10px var(--tc)}
#mult{font-size:18px;font-weight:900;font-style:italic;color:var(--tc);text-shadow:0 0 12px var(--tc);min-width:34px;text-align:center}
#mult.slam{animation:slamMult .45s cubic-bezier(.2,1.8,.3,1)}
@keyframes slamMult{0%{transform:scale(3) rotate(-12deg);opacity:0}60%{transform:scale(.85) rotate(4deg);opacity:1}100%{transform:scale(1)}}
#xpBox{margin-left:auto;text-align:right;line-height:1}
#xp{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
#xpBox small{display:block;font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--sub)}
#banner{position:relative;width:100%;max-width:380px;height:58px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;z-index:3}
#banner .slab{position:absolute;left:6%;right:6%;top:6px;bottom:12px;background:var(--bc,#ff4655);clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}
#banner .slab:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.8)}
#banner .txt{position:relative;margin-top:-6px;font-size:27px;font-weight:900;font-style:italic;letter-spacing:.1em;color:#fff;white-space:nowrap;
 text-shadow:-3px 0 rgba(255,42,109,.95),3px 0 rgba(5,217,232,.95),0 0 18px rgba(255,255,255,.6)}
#banner .sub{position:absolute;bottom:0;font-size:11px;font-weight:900;letter-spacing:.35em;color:var(--bc,#ff4655)}
#banner.show{animation:slam .5s cubic-bezier(.2,1.6,.3,1) forwards}
@keyframes slam{0%{transform:scale(3.2) skewX(-16deg);opacity:0;filter:blur(6px)}30%{transform:scale(.88) skewX(-8deg);opacity:1;filter:blur(0)}50%{transform:scale(1.08) skewX(-8deg)}100%{transform:scale(1) skewX(-8deg);opacity:1}}
#banner.out{transition:opacity .3s,transform .3s;opacity:0!important;transform:scale(1.2) skewX(-8deg)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;box-shadow:inset 0 0 160px 50px var(--tc);background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.35),transparent 55%)}
#flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#aura{position:fixed;left:-20%;right:-20%;bottom:-30%;height:70%;pointer-events:none;z-index:-1;opacity:0;background:radial-gradient(50% 50% at 50% 60%,var(--tc),transparent 70%);transition:opacity .5s;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
body[data-lv="1"] #aura{opacity:.18}body[data-lv="2"] #aura{opacity:.32}body[data-lv="3"] #aura{opacity:.5;animation-duration:.46s}body[data-lv="4"] #aura{opacity:.7;animation-duration:.38s}

#stage{position:relative;width:100%;max-width:380px;height:min(50vh,370px)}
/* FEVER（10 連続〜）：カードの後ろで虹色が流れて脈打つ */
#stage:before{content:"";position:absolute;inset:-9px;border-radius:38px;opacity:0;transition:opacity .3s;
 background:linear-gradient(90deg,#ff4fd8,#ffb400,#27e39a,#5b8cff,#ff4fd8);background-size:300% 100%;filter:blur(14px)}
body[data-fever="1"] #stage:before{opacity:1;animation:flow 1.1s linear infinite,beat .46s ease-in-out infinite}
@keyframes flow{to{background-position:300% 0}}
@keyframes beat{50%{transform:scale(1.03)}}
.card{position:absolute;inset:0;border-radius:30px;background:#fff;color:#12101f;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;overflow:hidden}
.card.enter{animation:enter .26s cubic-bezier(.2,1.3,.4,1)}
@keyframes enter{from{transform:scale(.9) translateY(14px);opacity:.3}to{transform:none;opacity:1}}
.card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.card .glow{position:absolute;inset:0;border-radius:30px;opacity:0;pointer-events:none}
.card .gng{background:linear-gradient(135deg,rgba(255,61,113,.55),rgba(255,79,216,.25))}
.card .gok{background:linear-gradient(135deg,rgba(39,227,154,.55),rgba(91,140,255,.2))}
.card .mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:190px;font-weight:900;line-height:1;opacity:0;pointer-events:none;text-shadow:0 0 30px rgba(255,255,255,.9)}
.card .mng{color:var(--ng)}.card .mok{color:#12c081}
.card .no{position:relative;font-size:13px;font-weight:800;color:#8b87a8;letter-spacing:.08em}
.card .tag{position:absolute;top:14px;left:16px;font-size:11px;font-weight:900;letter-spacing:.12em;color:#fff;padding:3px 9px;border-radius:99px;background:linear-gradient(90deg,#5b2cff,#ff4fd8)}
.card .word{position:relative;font-size:clamp(30px,10vw,44px);font-weight:900;letter-spacing:-.01em;text-align:center;word-break:break-word;margin-top:8px;line-height:1.1}
.card .back{position:relative;display:flex;flex-direction:column;align-items:center;min-height:86px}
.card .tapHint{margin-top:22px;font-size:13px;font-weight:900;letter-spacing:.12em;color:#fff;padding:8px 16px;border-radius:99px;background:linear-gradient(90deg,var(--a3),var(--a1));animation:hintPulse 1.4s ease-in-out infinite}
@keyframes hintPulse{50%{transform:scale(1.06)}}
.card .pos{margin-top:14px;font-size:13px;font-weight:900;color:#fff;padding:4px 12px;border-radius:99px;background:linear-gradient(90deg,var(--a3),var(--a1))}
.card .mean{margin-top:12px;font-size:18px;font-weight:700;color:#3a3752;text-align:center;line-height:1.55;animation:enter .22s ease-out}
.xpPop{position:absolute;left:50%;top:30%;z-index:5;pointer-events:none;font-size:34px;font-weight:900;font-style:italic;color:#fff;
 text-shadow:0 0 16px var(--tc),-2px 0 rgba(255,42,109,.8),2px 0 rgba(5,217,232,.8);animation:xpUp .8s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes xpUp{0%{transform:translate(-50%,10px) scale(.4);opacity:0}25%{transform:translate(-50%,-10px) scale(1.3);opacity:1}100%{transform:translate(60%,-150px) scale(.6);opacity:0}}
.hint{display:flex;justify-content:space-between;width:100%;max-width:380px;margin-top:12px;font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.06em}
.btns{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:12px}
.round{border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;transition:transform .12s,opacity .2s}
.round:active{transform:scale(.88)}
.round:disabled{opacity:.28}
#bng,#bok{width:76px;height:76px;font-size:36px}
#bng{background:linear-gradient(135deg,#ff3d71,#ff4fd8);box-shadow:0 10px 26px rgba(255,61,113,.5)}
#bok{background:linear-gradient(135deg,#27e39a,#26c6ff);box-shadow:0 10px 26px rgba(39,227,154,.45)}
#bundo{width:52px;height:52px;font-size:22px;background:rgba(255,255,255,.12);color:var(--ink)}

/* 結果 */
#review{display:none;padding:8px 18px 40px}
.result{display:flex;align-items:center;gap:18px;margin:6px 0 10px}
.ring{--p:0;width:118px;height:118px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring.pulse{animation:ringPulse .5s cubic-bezier(.2,1.8,.3,1)}
@keyframes ringPulse{40%{transform:scale(1.12)}}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}
#score{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#outof{font-size:12px;color:var(--sub);font-weight:800}
#rank{font-size:40px;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
#rankSub{font-size:14px;font-weight:700;color:var(--sub);margin-top:6px}
#best{margin-top:8px;display:inline-block;font-size:12px;font-weight:900;font-style:italic;letter-spacing:.1em;color:#fff;padding:4px 14px;background:var(--bc,#ff4655);clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);white-space:nowrap}
#best small{font-size:10px;letter-spacing:.08em;opacity:.9;margin-left:6px}
.xpTotal{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 14px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.06)}
.xpTotal .k{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--sub)}
#xpGain{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
#newBest{display:none;font-size:12px;font-weight:900;letter-spacing:.14em;color:#12101f;background:#ffd166;padding:3px 10px;border-radius:99px;margin-left:8px;animation:hintPulse .9s ease-in-out infinite}
.again{display:grid;gap:10px;margin:4px 0 18px}
.pill{border:0;border-radius:99px;padding:16px;font-size:18px;font-weight:900;color:#fff;letter-spacing:.03em}
.pill:active{transform:scale(.97)}
#againMiss{background:linear-gradient(90deg,#ff3d71,#ff4fd8);box-shadow:0 10px 26px rgba(255,61,113,.4)}
#againAll{background:linear-gradient(90deg,var(--a3),#26c6ff)}
#toHub{background:rgba(255,255,255,.1)}
.lead{font-size:13px;font-weight:800;color:var(--sub);margin:0 0 10px;letter-spacing:.04em}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
button.w{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--ink);min-height:52px;word-break:break-all}
button.w .n{font-size:11px;font-weight:800;color:var(--sub)}
button.w .t{font-size:16px;font-weight:800;margin-top:2px}
button.w .m{font-size:12px;font-weight:700;color:var(--sub);margin-top:2px}
button.w.on{background:linear-gradient(135deg,rgba(255,61,113,.35),rgba(255,79,216,.2));border-color:var(--ng)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="flash"></div><div id="aura"></div>
<header>
 <div class="top"><button id="back">← 一覧</button><div id="title">単語チェック</div><div id="count"></div></div>
 <div id="inkWrap">
  <div class="ink" id="ink"><div id="inkOk" class="empty"></div><div id="inkNg" class="empty"></div></div>
  <div class="inkNums"><span id="nOk">○ 0</span><span id="nNg">✕ 0</span></div>
 </div>
</header>
<div id="msg">読み込み中…</div>

<div id="hub">
 <div class="hubHead"><div class="big" id="hubBig"></div><div class="small" id="hubSmall"></div></div>
 <div class="stats"><div class="stat"><div class="k">TOTAL XP</div><div class="v" id="stXp">0</div></div><div class="stat"><div class="k">BEST STREAK</div><div class="v" id="stBest">0</div></div><div class="stat"><div class="k">覚えた語</div><div class="v" id="stLearn">0</div></div></div>
 <button class="review" id="reviewBtn"><div class="k">REVIEW ・ FSRS</div><div class="v" id="reviewV"></div><div class="s" id="reviewS"></div></button>
 <div id="days"></div>
</div>

<div id="swipe">
 <div class="hud"><div class="ticks"><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i></div><div id="mult"></div><div id="xpBox"><div id="xp">0</div><small>XP</small></div></div>
 <div id="banner"><div class="slab"></div><div class="txt"></div><div class="sub"></div></div>
 <div id="stage"></div>
 <div class="hint"><span>← ミス</span><span>覚えてた →</span></div>
 <div class="btns">
  <button class="round" id="bng" aria-label="ミス">✕</button>
  <button class="round" id="bundo" aria-label="ひとつ戻す">↶</button>
  <button class="round" id="bok" aria-label="覚えてた">○</button>
 </div>
</div>

<div id="review">
 <div class="result">
  <div class="ring" id="ring"><div><div><div id="score">0</div><div id="outof"></div></div></div></div>
  <div><div id="rank"></div><div id="rankSub"></div><div id="best"></div></div>
 </div>
 <div class="xpTotal"><div class="k">GET XP<span id="newBest">NEW BEST</span></div><div id="xpGain">+0</div></div>
 <div class="again">
  <button class="pill" id="againMiss"></button>
  <button class="pill" id="againAll">もう一周</button>
  <button class="pill" id="toHub">一覧にもどる</button>
 </div>
 <p class="lead" id="listLead"></p>
 <div id="list"></div>
</div>

<script>
var API = "https://script.google.com/macros/s/AKfycbzCQKcJbi7GdrWCQ2042uXWG1IyZbyL0Zf9fZ2VvlAsCdyABt6Cn-1xAcXkpKuSq__NwQ/exec";
var SID = (new URLSearchParams(location.search).get("s") || "").trim().toLowerCase();
var KEY = new URLSearchParams(location.hash.slice(1)).get("k") || "";

  $("againAll").style.display = PERIOD ? "block" : "none";
  $("toHub").textContent = PERIOD ? "一覧にもどる" : "送信して終わる";
  $("listLead").textContent = "ミスした語は赤。押しまちがいはタップで直せる";
  var list = $("list"); list.innerHTML = "";
  S.idx.forEach(function (wi, k) {
    var w = S.deck[wi], b = el("button", "w" + (S.res[k] ? " on" : ""));
    b.appendChild(el("span", "n", "No." + (w[4] || w[0]))); b.appendChild(el("span", "t", w[1]));
    if (w[2]) b.appendChild(el("span", "m", w[2].split("／")[0]));
    b.onclick = function () {
      S.res[k] = !S.res[k]; b.classList.toggle("on", S.res[k]); buzz(8);
      // 押しまちがいを直したら FSRS も直す（その日の最初の 1 回だったときだけ効いている）
      if (S.fs[k]) { fsrsUndo(S.fs[k]); S.fs[k] = fsrsRate(w[5], !S.res[k]); }
      refreshAgain();
    };
    list.appendChild(b);
  });
}
function refreshAgain() { var m = missIdx(); $("againMiss").style.display = PERIOD && m.length ? "block" : "none"; $("againMiss").textContent = "ミスだけもう一周（" + m.length + "語）"; }
$("againMiss").onclick = function () {
  var m = missIdx(), s = S; commit();
  if (s.kind === "fsrs") startReview(m.map(function (wi) { return s.deck[wi]; }), s.round + 1); else start(s.di, s.bi, "miss", m);
};
$("againAll").onclick = function () {
  var s = S; commit();
  if (s.kind === "fsrs") startReview(s.deck, s.round + 1); else start(s.di, s.bi, "all");
};
$("toHub").onclick = function () { commit(); if (PERIOD) hub(); else show("送信しました。おつかれさま"); };

// ================================================================ 送信（待たせない・届かなければ端末に残して送り直す）
var PENDING = "wordcheck_pending";
function pending() { return store(PENDING) || []; }
function flush() {
  pending().forEach(function (item) {
    fetch(API, { method: "POST", mode: "no-cors", keepalive: true, body: JSON.stringify(item.body) })
      .then(function () { store(PENDING, pending().filter(function (x) { return x.t !== item.t; })); })
      .catch(function () {});
  });
}
function commit() {
  if (!S || S.sent || S.i < S.idx.length) return;
  S.sent = true;
  var body, items = function (keyOf) { return S.idx.map(function (wi, k) { var w = S.deck[wi]; return [keyOf(w), S.res[k] ? 0 : 1, S.times[k] ? S.times[k][0] : 0, S.times[k] ? S.times[k][1] : 0]; }); };
  if (S.kind === "fsrs") {
    body = { v: 2, p: SID, id: S.id, day: 0, b: "e", round: S.round, mode: "fsrs", started: S.started, ended: Date.now(), undo: S.undo, items: items(function (w) { return w[5]; }) };
  } else if (PERIOD) {
    body = { v: 2, p: SID, id: S.id, day: S.di + 1, b: P.days[S.di].books[S.bi].b, round: S.round, mode: S.mode, started: S.started, ended: Date.now(), undo: S.undo, items: items(function (w) { return w[0]; }) };
  } else {
    body = { s: SID, miss: missIdx().map(function (wi) { return S.deck[wi][0]; }) };
  }
  store(PENDING, pending().concat([{ t: Date.now() + Math.random(), body: body }]));
  flush();
}
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") commit(); });
flush();

// ================================================================ 読み込み
function b64u(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for (var j = 0; j < b.length; j++) u[j] = b.charCodeAt(j); return u; }
function loadLocal() {
  return fetch("d/" + SID + ".txt")
    .then(function (r) { if (!r.ok) throw new Error("nf"); return r.text(); })
    .then(function (t) {
      var raw = b64u(t.trim());
      return crypto.subtle.importKey("raw", b64u(KEY), "AES-GCM", false, ["decrypt"])
        .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, k, raw.slice(12)); });
    })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}
function loadApi() { return fetch(API + "?s=" + SID).then(function (r) { return r.json(); }).then(function (d) { if (!d.ok) throw new Error("nf"); return d; }); }
if (!/^[0-9a-z]{23}$/.test(SID)) {
  show("この QR のデータが見つからない。先生に知らせてね");
} else {
  screen("msg");
  (KEY ? loadLocal().catch(function (e) { if (PERIOD) throw e; return loadApi(); }) : loadApi())
    .then(function (d) {
      if (PERIOD) {
        P = d;
        // 語の索引（行番号 → [紙の No., 単語, 訳, 品詞, 単語帳の番号, 行番号]）。復習の語は前の期間の語も含む
        Object.keys(P.cards || {}).forEach(function (row) { var c = P.cards[row]; INDEX[row] = [0, c[1], c[2], c[3], c[4], +row]; });
        P.days.forEach(function (day) { day.books.forEach(function (bk) { bk.words.forEach(function (w) { if (w[5]) INDEX[w[5]] = w; }); }); });
        fsrsSeed(); hub(); return;
      }
      P = { days: [{ date: "", books: [{ b: SID.charAt(6), label: d.title, words: d.words }] }] };
      start(0, 0, "all");
    })
    .catch(function (e) { show(e && e.message === "nf" ? "この QR のデータが見つからない。先生に知らせてね" : "読み込めなかった。電波のいい所でもう一回開いてね"); });
}
</script>
