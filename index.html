<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f4f6">
<title>単語チェック</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="単語チェック">
<!--
  単語チェック（宿題の単語アプリ）
  - 期間の QR（?s=<期間ID>、7 文字目が p）：単語帳ごとに「今日の分」→ 単語だけ見て答える → タップで訳 → ○／✕。
    今日の分＝FSRS で期限が来た語（最大 100）＋まだやっていない範囲の語（残り÷テストまでの日数、範囲の中でランダム）。
    終わったら「もっとやる」。評価は ○＝Good・✕＝Again の 2 択。その日の最初の 1 回だけが FSRS に効く（同じ日の周回は練習）。
    本人決定（2026-09-16）：日ごとの 50 語はやめる（紙 1 面の都合だったため）、苦手語は誤答プールに入れず FSRS だけ。
  - 紙の QR（?s=<シートID>、7 文字目が e/k）：紙の宿題の答え合わせのあとに誤答を入れる（前からの形）。
  見た目（2026-09-16 本人希望）：シンプルに。演出なし、白基調。フリックはそのまま。
  このページには単語も氏名も入っていない。データは暗号化して d/<ID>.txt、鍵は URL の # の後ろ。
  ホーム画面と毎日の通知（2026-09-17 本人決定）：一覧の上に「今日の残り」。ホーム画面に追加すると
  毎日好きな時刻（30 分刻み、端末ごと。既定 19:00）に残りの数を通知（通知サーバーは Cloudflare Worker、フォルダ「通知」）。送るのは生徒コードと残りの数だけ。
  ホーム画面のアイコンは追加したときの QR のアドレスで開くので、期間のデータに「最新の期間の置き場」（ptr）を入れ、
  新しい期間があればそちらへ切り替える。
-->
<style>
:root{--bg:#f4f4f6;--card:#fff;--ink:#1c1c22;--sub:#6e6e78;--line:#e2e2e8;--ok:#1a9d5c;--ng:#d93d4a;--acc:#2f6fdf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;max-width:100%}
/* フリック中に画面が横へ動かないように（本人：横スクロールがストレス 2026-09-15） */
body.lock{position:fixed;inset:0;overflow:hidden;touch-action:none}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:var(--bg);overscroll-behavior:none;overflow-x:hidden}
button{font-family:inherit;color:inherit}

header{padding:calc(12px + env(safe-area-inset-top)) 18px 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
#back{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:14px}
#title{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--sub)}

/* 進み具合：○＝緑が左から、✕＝赤が右から（本人希望 2026-09-16） */
#progWrap{display:none;margin-top:8px}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>div{position:absolute;top:0;bottom:0;width:0;transition:width .2s ease-out}
#barOk{left:0;background:var(--ok)}
#barNg{right:0;background:var(--ng)}
.nums{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
#nOk{color:var(--ok)}#nNg{color:var(--ng)}

#msg{display:none;text-align:center;font-size:17px;padding:80px 24px;color:var(--sub)}

/* 一覧：単語帳ごとに「今日の分」 */
#hub{display:none;padding:8px 18px 40px}
.hubHead{margin:4px 0 16px}
.hubHead .big{font-size:24px;font-weight:700}
.hubHead .small{margin-top:4px;font-size:13px;color:var(--sub)}
.left{border-radius:12px;background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.left .lab{font-size:13px;color:var(--sub)}
.left .num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.left .num small{font-size:15px;font-weight:600;color:var(--sub);margin-left:4px}
.left .per{margin-top:2px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.left.zero .num{color:var(--ok)}
#gear{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:14px}
#hubNote{display:none;width:100%;margin:0 0 12px;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:14px;background:transparent;color:var(--sub);text-align:left}
#settings{display:none;padding:8px 18px 40px}
.sec{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.sec h2{margin:0 0 6px;font-size:16px}
#notify{font-size:13px;color:var(--sub);line-height:1.6}
#notify select{margin:0 4px;font-size:16px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
#notify .tline{margin-top:6px;font-size:15px;color:var(--ink)}
#notify button{display:block;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-weight:600;background:var(--card);color:var(--ink)}
.book{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--card)}
.book .name{font-size:17px;font-weight:700}
.book .range{margin-top:2px;font-size:13px;color:var(--sub)}
.book .learned{margin-top:10px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.book .lbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.book .lbar>div{height:100%;background:var(--ok)}
.book .go{display:block;width:100%;margin-top:12px;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:700;background:var(--acc);color:#fff}
.book .go.done{background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.book .more{display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-weight:600;background:var(--card)}

/* カード */
#swipe{display:none;flex-direction:column;align-items:center;padding:8px 18px 24px;position:relative;overflow:hidden;touch-action:none}
#stage{position:relative;width:100%;max-width:380px;height:min(52vh,380px);margin-top:6px}
.card{position:absolute;inset:0;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;overflow:hidden}
.card .glow{position:absolute;inset:0;opacity:0;pointer-events:none}
.card .gng{background:rgba(217,61,74,.14)}
.card .gok{background:rgba(26,157,92,.14)}
.card .mark{position:absolute;top:14px;font-size:30px;font-weight:700;opacity:0;pointer-events:none}
.card .mng{left:18px;color:var(--ng)}.card .mok{right:18px;color:var(--ok)}
.card .tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--sub)}
.card .no{position:relative;font-size:13px;color:var(--sub)}
.card .word{position:relative;font-size:clamp(28px,9vw,40px);font-weight:700;text-align:center;word-break:break-word;margin-top:6px;line-height:1.15}
.card .back{position:relative;display:flex;flex-direction:column;align-items:center;min-height:86px}
.card .tapHint{margin-top:22px;font-size:14px;color:var(--sub)}
.card .pos{margin-top:14px;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.card .mean{margin-top:10px;font-size:18px;text-align:center;line-height:1.55}
.hint{display:flex;justify-content:space-between;width:100%;max-width:380px;margin-top:10px;font-size:13px;color:var(--sub)}
.btns{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:12px}
.round{border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card)}
.round:disabled{opacity:.35}
#bng,#bok{width:68px;height:68px;font-size:30px;font-weight:700}
#bng{color:var(--ng)}#bok{color:var(--ok)}
#bundo{width:48px;height:48px;font-size:20px;color:var(--sub)}

/* 結果 */
#review{display:none;padding:8px 18px 40px}
.result{margin:8px 0 18px}
.result .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.result .big small{font-size:18px;color:var(--sub);font-weight:600;margin-left:4px}
.result .sub{font-size:14px;color:var(--sub);margin-top:2px}
.again{display:grid;gap:8px;margin:0 0 20px}
.pill{border:1px solid var(--line);border-radius:10px;padding:14px;font-size:16px;font-weight:600;background:var(--card)}
#againMiss{background:var(--acc);border-color:var(--acc);color:#fff}
.lead{font-size:13px;color:var(--sub);margin:0 0 8px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
button.w{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);min-height:50px;word-break:break-all}
button.w .n{font-size:11px;color:var(--sub)}
button.w .t{font-size:15px;font-weight:600;margin-top:1px}
button.w .m{font-size:12px;color:var(--sub);margin-top:1px}
button.w.on{background:#fdeced;border-color:var(--ng)}
button.w.on .t{color:var(--ng)}
</style>
</head>
<body>
<header>
 <div class="top"><button id="back">← 一覧</button><div id="title">単語チェック</div><div id="count"></div><button id="gear" aria-label="設定">設定</button></div>
 <div id="progWrap">
  <div class="bar"><div id="barOk"></div><div id="barNg"></div></div>
  <div class="nums"><span id="nOk">○ 0</span><span id="nNg">✕ 0</span></div>
 </div>
</header>
<div id="msg">読み込み中…</div>

<div id="hub">
 <div class="hubHead"><div class="big" id="hubBig"></div><div class="small" id="hubSmall"></div></div>
 <div class="left" id="leftBox"><div class="lab">今日の残り</div><div class="num" id="leftNum"></div><div class="per" id="leftPer"></div></div>
 <button id="hubNote"></button>
 <div id="books"></div>
</div>

<div id="settings">
 <div class="sec"><h2>毎日の通知</h2><div id="notify"></div></div>
</div>

<div id="swipe">
 <div id="stage"></div>
 <div class="hint"><span>← ミス</span><span>覚えてた →</span></div>
 <div class="btns">
  <button class="round" id="bng" aria-label="ミス">✕</button>
  <button class="round" id="bundo" aria-label="ひとつ戻す">↶</button>
  <button class="round" id="bok" aria-label="覚えてた">○</button>
 </div>
</div>

<div id="review">
 <div class="result"><div class="big"><span id="score">0</span><small id="outof"></small></div><div class="sub" id="resSub"></div></div>
 <div class="again">
  <button class="pill" id="againMiss"></button>
  <button class="pill" id="againAll">もう一周</button>
  <button class="pill" id="toHub">一覧にもどる</button>
 </div>
 <p class="lead" id="listLead"></p>
 <div id="list"></div>
</div>

<script src="left.js"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbwsGa_Uy_OUv4okR-Lms4a0sF0t6gLJrPtoRJc-g5c_Cbr8fRf7_F43nnjzZWrfshJ_0g/exec";   // 2026-09-15 夜（FSRS 対応）にデプロイし直した URL
var NOTIFY = "https://wordcheck-notify.wc30df6df0.workers.dev";     // 通知サーバー（Cloudflare Worker）
var VAPID = "BP7_JwgCCmh-V3y54PnC3u9K5KV1RZZWYuIvhTfC1a_X6v7ry_OkzieJ2P4fn8-CM5tS7HLt5s-6V_jt5XYkW-Q";    // 通知サーバーの公開鍵
var DEFAULT_TIME = "19:00";         // 通知の時刻の既定（生徒が 30 分刻みで変えられる。Worker と合わせる）
var SID = (new URLSearchParams(location.search).get("s") || "").trim().toLowerCase();
var KEY = new URLSearchParams(location.hash.slice(1)).get("k") || "";
var PERIOD = SID.charAt(6) === "p";
var ME = SID.slice(0, 6);                // 生徒コード（端末に残す FSRS のまとまり）
// ホーム画面のアイコンは古い期間のアドレスで開く → 端末に残した新しい期間があればそちらを使う
if (PERIOD) {
  var CUR = store("cur:" + ME);
  if (CUR && CUR.s && CUR.k && CUR.s.slice(7, 13) > SID.slice(7, 13)) { SID = CUR.s; KEY = CUR.k; }
}
var WD = "日月火水木金土", REVIEW_MAX = 100, MORE = 20;
// 送る記録の day 欄に入れる周の種類（Apps Script を出し直さずに済むよう mode は fsrs のまま）
var KIND = { today: 0, more: 1, miss: 2, again: 3 };
var P = null, S = null, busy = false, INDEX = {}, BOOK = {};   // INDEX：行番号 → [0, 単語, 訳, 品詞, 単語帳の番号, 行番号]、BOOK：行番号 → "e"/"k"
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function screen(id) {
  document.body.classList.toggle("lock", id === "swipe");
  if (id !== "swipe") window.scrollTo(0, 0);
  ["msg", "hub", "swipe", "review", "settings"].forEach(function (k) { $(k).style.display = "none"; });
  $(id).style.display = id === "swipe" ? "flex" : "block";
  $("progWrap").style.display = (id === "swipe" || id === "review") ? "block" : "none";
  $("back").style.display = PERIOD && id !== "hub" && id !== "msg" ? "block" : "none";
  $("gear").style.display = PERIOD && id === "hub" ? "block" : "none";
}
function show(text) { screen("msg"); $("msg").textContent = text; }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function rid() { var a = new Uint8Array(9); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (x) { return ("0" + x.toString(36)).slice(-2); }).join("").slice(0, 16); }
function iso(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function todayIso() { return iso(new Date()); }
function days(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function md(s) { var d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate() + "（" + WD[d.getDay()] + "）"; }
function shuffle(a) { for (var j = a.length - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[r]; a[r] = t; } return a; }

// ================================================================ FSRS（4.5・既定の重み。weekly_paper.py と同じ式）
// ○＝Good(3)、✕＝Again(1)。その日の最初の 1 回だけ効かせる。目標の想起率 0.9 → 次の間隔＝安定度（日）
var FW = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
var DECAY = -0.5, FACTOR = 19 / 81;
function clampD(d) { return Math.min(10, Math.max(1, d)); }
function retr(t, s) { return Math.pow(1 + FACTOR * t / s, DECAY); }
function fsrsNext(st, g, t) {
  if (!st) return [FW[g - 1], clampD(FW[4] - FW[5] * (g - 3))];
  var s = st[0], d = st[1], r = retr(Math.max(0, t), s);
  var d2 = clampD(FW[7] * FW[4] + (1 - FW[7]) * (d - FW[6] * (g - 3)));
  var s2 = g === 1
    ? Math.min(s, FW[11] * Math.pow(d2, -FW[12]) * (Math.pow(s + 1, FW[13]) - 1) * Math.exp(FW[14] * (1 - r)))
    : s * (Math.exp(FW[8]) * (11 - d2) * Math.pow(s, -FW[9]) * (Math.exp(FW[10] * (1 - r)) - 1) + 1);
  return [Math.max(0.1, s2), d2];
}
function fsrsKey() { return "fsrs:" + ME; }
function fsrsAll() { return store(fsrsKey()) || {}; }
// 端末の記録と、配られたデータ（それまでの全記録から計算したもの）の新しいほうを使う
function fsrsSeed() {
  var mine = fsrsAll(), cards = (P && P.cards) || {};
  Object.keys(cards).forEach(function (row) {
    var c = cards[row], seed = [c[5], c[6], c[7]];
    if (!mine[row] || mine[row][2] < seed[2]) mine[row] = seed;
  });
  store(fsrsKey(), mine);
}
function fsrsRate(row, ok) {
  if (!row) return null;
  var all = fsrsAll(), cur = all[row], today = todayIso();
  if (cur && cur[2] === today) return null;            // 同じ日の 2 回目以降は練習
  var next = fsrsNext(cur ? [cur[0], cur[1]] : null, ok ? 3 : 1, cur ? days(cur[2], today) : 0);
  all[row] = [next[0], next[1], today]; store(fsrsKey(), all);
  return [row, cur || null];                             // 戻すときのために前の状態を返す
}
function fsrsUndo(prev) { if (!prev) return; var all = fsrsAll(); if (prev[1]) all[prev[0]] = prev[1]; else delete all[prev[0]]; store(fsrsKey(), all); }
// 期限が来た語（今までやった全部の語から、その単語帳だけ）。忘れていそうな順に最大 REVIEW_MAX
function dueCards(b) {
  var all = fsrsAll(), today = todayIso(), out = [];
  Object.keys(all).forEach(function (row) {
    var st = all[row], e = INDEX[row];
    if (!e || BOOK[row] !== b || st[2] === today) return;
    var t = days(st[2], today);
    if (t >= Math.max(1, Math.round(st[0]))) out.push([retr(t, st[0]), e]);
  });
  out.sort(function (a, b) { return a[0] - b[0]; });
  return out.slice(0, REVIEW_MAX).map(function (x) { return x[1]; });
}

// ================================================================ 今日の分
// その日に初めて開いたときに、まだやっていない範囲の語から「残り÷テストまでの日数」をランダムに決めて端末に残す
function planKey(bk) { return "day:" + SID + ":" + bk.b + ":" + todayIso(); }
function todayPlan(bk) {
  var key = planKey(bk), pl = store(key);
  if (!pl) {
    var all = fsrsAll(), unseen = bk.words.filter(function (w) { return !all[w[5]]; }).map(function (w) { return w[5]; });
    var left = Math.max(1, days(todayIso(), P.test));   // テストの前日まで。当日・過ぎたら残り全部
    pl = { rows: shuffle(unseen).slice(0, Math.ceil(unseen.length / left)) };
    store(key, pl);
  }
  return pl;
}
function newToday(bk) { var all = fsrsAll(); return todayPlan(bk).rows.filter(function (r) { return !all[r] && INDEX[r]; }).map(function (r) { return INDEX[r]; }); }
function todayDeck(bk) { return dueCards(bk.b).concat(newToday(bk)); }
// もっとやる：まだやっていない語を MORE 語ずつ前倒し。全部やったら範囲からランダムに 50 語（練習）
function moreDeck(bk) {
  var all = fsrsAll(), pl = todayPlan(bk);
  var unseen = bk.words.filter(function (w) { return !all[w[5]] && pl.rows.indexOf(w[5]) < 0; }).map(function (w) { return w[5]; });
  if (unseen.length) {
    var add = shuffle(unseen).slice(0, MORE);
    pl.rows = pl.rows.concat(add); store(planKey(bk), pl);
    return add.map(function (r) { return INDEX[r]; });
  }
  return shuffle(bk.words.slice()).slice(0, 50);
}
function learned(bk) { var all = fsrsAll(); return bk.words.filter(function (w) { return all[w[5]]; }).length; }

// ================================================================ 一覧
function hub() {
  screen("hub"); $("title").textContent = "単語チェック"; $("count").textContent = "";
  $("hubBig").textContent = "テスト " + md(P.test);
  $("hubSmall").textContent = "毎日「今日の分」を終わらせよう。もっとやってもOK";
  var box = $("books"), total = 0, per = []; box.innerHTML = "";
  P.books.forEach(function (bk) {
    var deck = todayDeck(bk), n = bk.words.length, k = learned(bk), card = el("div", "book");
    card.appendChild(el("div", "name", bk.label));
    card.appendChild(el("div", "range", bk.range));
    card.appendChild(el("div", "learned", "範囲のうち やった語 " + k + " / " + n));
    var lb = el("div", "lbar"), fill = el("div"); fill.style.width = (n ? k / n * 100 : 0) + "%"; lb.appendChild(fill); card.appendChild(lb);
    var go = el("button", "go" + (deck.length ? "" : " done"), deck.length ? "今日の分　" + deck.length + " 語" : "今日の分は終わり");
    if (deck.length) go.onclick = function () { begin(bk, "today", todayDeck(bk), 1); };
    card.appendChild(go);
    var more = el("button", "more", "もっとやる");
    more.onclick = function () { begin(bk, "more", moreDeck(bk), 1); };
    card.appendChild(more);
    box.appendChild(card);
    total += deck.length; per.push((bk.b === "k" ? "古文 " : "英 ") + deck.length + " 語");
  });
  $("leftBox").classList.toggle("zero", !total);
  $("leftNum").innerHTML = "";
  if (total) { $("leftNum").textContent = total; $("leftNum").appendChild(el("small", null, "語")); }
  else $("leftNum").textContent = "終わり！";
  $("leftPer").textContent = total ? per.join("・") : "もっとやってもOK";
  saveState(); hubNote();
}
// 設定画面
$("gear").onclick = function () { screen("settings"); $("title").textContent = "設定"; $("count").textContent = ""; notifyBox(); };
$("back").onclick = function () { commit(); hub(); };

// ================================================================ セッション
function begin(bk, kind, deck, round) {
  if (!deck.length) return;
  S = { book: bk, kind: kind, round: round, deck: deck, idx: deck.map(function (w, k) { return k; }), i: 0, res: [], times: [], fs: [], undo: 0,
        started: Date.now(), id: rid(), sent: false, shownAt: 0, flipAt: 0, flipped: false };
  var names = { today: "今日の分", more: "もっとやる", miss: "ミスだけ", again: "もう一周" };
  $("title").textContent = (bk.label || "") + "　" + names[kind] + (round > 1 ? "　" + round + "周目" : "");
  screen("swipe"); render();
}
function word() { return S.deck[S.idx[S.i]]; }
function counts() { var ok = 0, ng = 0; for (var j = 0; j < S.i; j++) { if (S.res[j]) ng++; else ok++; } return [ok, ng]; }
function progress() {
  var n = S.idx.length, c = counts();
  $("count").textContent = Math.min(S.i + 1, n) + " / " + n;
  $("barOk").style.width = (c[0] / n * 100) + "%"; $("barNg").style.width = (c[1] / n * 100) + "%";
  $("nOk").textContent = "○ " + c[0]; $("nNg").textContent = "✕ " + c[1];
}
function setButtons() { $("bng").disabled = $("bok").disabled = !S.flipped; $("bundo").disabled = S.i === 0; }
function render() {
  var stage = $("stage"); [].slice.call(stage.querySelectorAll(".card")).forEach(function (c) { c.remove(); }); progress();
  if (S.i >= S.idx.length) { finish(); return; }
  var w = word(), card = el("div", "card");
  card.appendChild(el("div", "glow gng")); card.appendChild(el("div", "glow gok"));
  card.appendChild(el("div", "mark mng", "✕")); card.appendChild(el("div", "mark mok", "○"));
  if (PERIOD && !fsrsAll()[w[5]]) card.appendChild(el("div", "tag", "はじめて"));
  card.appendChild(el("div", "no", "No." + (w[4] || w[0])));
  card.appendChild(el("div", "word", w[1]));
  var back = el("div", "back"); card.appendChild(back);
  S.flipped = false; S.shownAt = Date.now(); S.flipAt = 0;
  if (PERIOD) back.appendChild(el("div", "tapHint", "タップで答え")); else flip(card, back);
  stage.appendChild(card); setButtons();
  var sx = null, dx = 0;
  card.onpointerdown = function (e) { sx = e.clientX; dx = 0; try { card.setPointerCapture(e.pointerId); } catch (err) {} card.style.transition = "none"; };
  card.onpointermove = function (e) {
    if (sx === null) return; dx = e.clientX - sx;
    if (!S.flipped) { card.style.transform = "translateX(" + dx * .15 + "px)"; return; }
    card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 16) + "deg)"; tint(card, dx / 110);
  };
  card.onpointerup = card.onpointercancel = function () {
    if (sx === null) return; sx = null;
    if (!S.flipped) { card.style.transition = "transform .2s ease-out"; card.style.transform = ""; flip(card, back); return; }
    if (dx > 90) decide(false, 1); else if (dx < -90) decide(true, -1);
    else { card.style.transition = "transform .25s ease-out"; card.style.transform = ""; tint(card, 0); }
  };
}
function flip(card, back) {
  if (S.flipped) return;
  var w = word(); back.innerHTML = "";
  if (w[3]) back.appendChild(el("div", "pos", w[3]));
  if (w[2]) back.appendChild(el("div", "mean", w[2].split("／").join("、")));
  S.flipped = true; S.flipAt = Date.now(); setButtons();
}
function tint(card, r) {
  r = Math.max(-1, Math.min(1, r)); var a = Math.abs(r);
  card.querySelector(".gng").style.opacity = r < 0 ? a : 0; card.querySelector(".gok").style.opacity = r > 0 ? a : 0;
  card.querySelector(".mng").style.opacity = r < 0 ? a : 0; card.querySelector(".mok").style.opacity = r > 0 ? a : 0;
}
function decide(miss, dir) {
  if (busy || !S.flipped || S.i >= S.idx.length) return; busy = true;
  var now = Date.now(), w = word();
  S.res[S.i] = miss; S.times[S.i] = [S.flipAt ? S.flipAt - S.shownAt : 0, now - S.shownAt];
  S.fs[S.i] = PERIOD ? fsrsRate(w[5], !miss) : null;
  var card = $("stage").querySelector(".card"); tint(card, dir); card.style.transition = "transform .22s ease-in";
  card.style.transform = "translateX(" + (dir * 520) + "px) rotate(" + (dir * 24) + "deg)";
  setTimeout(function () { busy = false; S.i++; render(); }, 200);
}
$("bng").onclick = function () { decide(true, -1); };
$("bok").onclick = function () { decide(false, 1); };
$("bundo").onclick = function () {
  if (S.i > 0 && !busy) { S.i--; fsrsUndo(S.fs[S.i]); S.res.length = S.fs.length = S.times.length = S.i; S.undo++; render(); }
};

// ================================================================ 結果
function missIdx() { return S.idx.filter(function (x, k) { return S.res[k]; }); }
function showScore() {
  var n = S.idx.length, ok = S.res.filter(function (x) { return x === false; }).length;
  $("score").textContent = "○ " + ok; $("outof").textContent = "/ " + n;
  $("resSub").textContent = ok === n ? "全部 ○" : "✕ " + (n - ok) + " 語";
}
function finish() {
  screen("review"); $("count").textContent = "結果"; showScore(); refreshAgain();
  $("againAll").style.display = PERIOD ? "block" : "none";
  $("toHub").textContent = PERIOD ? "一覧にもどる" : "送信して終わる";
  $("listLead").textContent = "ミスした語は赤。押しまちがいはタップで直せる";
  var list = $("list"); list.innerHTML = "";
  S.idx.forEach(function (wi, k) {
    var w = S.deck[wi], b = el("button", "w" + (S.res[k] ? " on" : ""));
    b.appendChild(el("span", "n", "No." + (w[4] || w[0]))); b.appendChild(el("span", "t", w[1]));
    if (w[2]) b.appendChild(el("span", "m", w[2].split("／")[0]));
    b.onclick = function () {
      S.res[k] = !S.res[k]; b.classList.toggle("on", S.res[k]);
      // 押しまちがいを直したら FSRS も直す（その日の最初の 1 回だったときだけ効いている）
      if (S.fs[k]) { fsrsUndo(S.fs[k]); S.fs[k] = fsrsRate(w[5], !S.res[k]); }
      showScore(); refreshAgain();
    };
    list.appendChild(b);
  });
}
function refreshAgain() { var m = missIdx(); $("againMiss").style.display = PERIOD && m.length ? "block" : "none"; $("againMiss").textContent = "ミスだけもう一周（" + m.length + "語）"; }
$("againMiss").onclick = function () {
  var s = S, m = missIdx().map(function (wi) { return s.deck[wi]; }); commit();
  begin(s.book, "miss", m, s.round + 1);
};
$("againAll").onclick = function () { var s = S; commit(); begin(s.book, "again", shuffle(s.deck.slice()), s.round + 1); };
$("toHub").onclick = function () { commit(); if (PERIOD) hub(); else show("送信しました。おつかれさま"); };

// ================================================================ ホーム画面・毎日の通知
// 新しい期間が出ていたら切り替える（一覧を見ているときだけ。次に開いたときは端末の記録から直接）
function checkLatest(ptr) {
  if (!ptr) return;
  loadLocal(ptr[0], ptr[1]).then(function (x) {
    if (!x.s || x.s === SID || x.s.slice(7, 13) <= SID.slice(7, 13)) return;
    store("cur:" + ME, { s: x.s, k: x.k });
    if (!S) location.reload();
  }).catch(function () {});
}
// 通知の service worker が読む状態（Cache Storage に置く。service worker は localStorage を読めない）
function saveState() {
  if (!PERIOD || !P || !window.caches) return;
  var plans = {};
  P.books.forEach(function (bk) { var pl = store(planKey(bk)); if (pl) plans[bk.b] = { date: todayIso(), rows: pl.rows }; });
  var snap = { test: P.test, bookOf: BOOK, fsrs: fsrsAll(), plans: plans, url: location.href,
               books: P.books.map(function (bk) { return { b: bk.b, label: bk.label, rows: bk.words.map(function (w) { return w[5]; }) }; }) };
  caches.open("wc-state").then(function (c) {
    return c.put("state.json", new Response(JSON.stringify(snap), { headers: { "Content-Type": "application/json" } }));
  }).catch(function () {});
  var total = wcLeft(snap).reduce(function (a, x) { return a + x.n; }, 0);
  if (navigator.setAppBadge && window.Notification && Notification.permission === "granted") {
    (total ? navigator.setAppBadge(total) : navigator.clearAppBadge()).catch(function () {});
  }
  // 残りの数を通知サーバーへ（0 の日は通知しない。変わったときだけ送る）
  var sent = store("left:sent"), now = todayIso() + ":" + total;
  if (store("push:on") && sent !== now) {
    post("/left", { c: ME, d: todayIso(), n: total }).then(function () { store("left:sent", now); }).catch(function () {});
  }
}
function post(path, body) {
  return fetch(NOTIFY + path, { method: "POST", body: JSON.stringify(body) }).then(function (r) { if (!r.ok) throw new Error("http"); return r; });
}
function standalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
function isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
var SWREG = null;
function startPush() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then(function (reg) { SWREG = reg; notifyBox(); }).catch(function () {});
}
// 一覧の案内：通知がまだのときだけ
function hubNote() {
  var b = $("hubNote"), ok = "serviceWorker" in navigator && ("PushManager" in window || (isIOS() && !standalone()));
  var on = store("push:on") && window.Notification && Notification.permission === "granted";
  b.style.display = PERIOD && ok && !on ? "block" : "none";
  b.textContent = "毎日、残りの数を通知で受け取る →";
  b.onclick = function () { $("gear").onclick(); };
}
function notifyBox() {
  var box = $("notify"); box.innerHTML = "";
  if (!PERIOD || !("serviceWorker" in navigator)) { box.textContent = "この端末では通知を使えない"; return; }
  if (!("PushManager" in window)) {
    if (isIOS() && !standalone()) {
      box.textContent = "ホーム画面に追加すると、毎日好きな時刻に残りの数が通知で届く（下の共有ボタン →「ホーム画面に追加」→ ホーム画面のアイコンから開く）";
    } else box.textContent = "この端末では通知を使えない";
    return;
  }
  if (Notification.permission === "denied") { box.textContent = "通知がオフになっている。設定アプリ →「通知」→「単語チェック」でオンにしてね"; return; }
  var on = store("push:on") && Notification.permission === "granted";
  box.appendChild(el("div", null, on ? "残りの数を毎日通知中（終わった日は来ない）" : "残りの数を毎日、通知で受け取れる"));
  // 時刻（30 分刻み）。オンのときは変えたらすぐ登録し直す
  var line = el("div", "tline", "毎日"), sel = el("select"), cur = pushTime();
  for (var h = 5; h < 24; h++) ["00", "30"].forEach(function (m) {
    var v = ("0" + h).slice(-2) + ":" + m, o = el("option", null, h + ":" + m); o.value = v; if (v === cur) o.selected = true; sel.appendChild(o);
  });
  sel.onchange = function () {
    var prev = pushTime(); store("push:time", sel.value);
    if (on) pushOn().then(function () { note.textContent = "変更した"; }, function () { store("push:time", prev); sel.value = prev; note.textContent = "変更できなかった。電波のいい所でもう一回"; });
  };
  var note = el("span"); note.style.marginLeft = "6px"; note.style.fontSize = "13px"; note.style.color = "var(--sub)";
  line.appendChild(sel); line.appendChild(document.createTextNode("に通知")); line.appendChild(note);
  box.appendChild(line);
  var b = el("button", null, on ? "通知をやめる" : "通知をオンにする");
  b.onclick = function () { b.disabled = true; (on ? pushOff() : pushOn()).then(notifyBox, function () { b.disabled = false; b.textContent = "うまくいかなかった。もう一回"; }); };
  box.appendChild(b);
}
function pushTime() { var t = store("push:time"); return /^\d\d:[03]0$/.test(t || "") ? t : DEFAULT_TIME; }
function pushOn() {
  return Notification.requestPermission().then(function (p) {
    if (p !== "granted") { notifyBox(); throw new Error("denied"); }
    return navigator.serviceWorker.ready;
  }).then(function (reg) {
    return reg.pushManager.getSubscription().then(function (sub) {
      return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
    });
  }).then(function (sub) {
    return post("/sub", { c: ME, sub: sub.toJSON(), t: pushTime() });
  }).then(function () { store("push:on", true); store("left:sent", ""); saveState(); });
}
function pushOff() {
  return navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
    if (!sub) return;
    var ep = sub.endpoint;
    return sub.unsubscribe().then(function () { return post("/unsub", { c: ME, endpoint: ep }).catch(function () {}); });
  }).then(function () { store("push:on", false); });
}

// ================================================================ 送信（待たせない・届かなければ端末に残して送り直す）
var PENDING = "wordcheck_pending";
function pending() { return store(PENDING) || []; }
function flush() {
  pending().forEach(function (item) {
    fetch(API, { method: "POST", mode: "no-cors", keepalive: true, body: JSON.stringify(item.body) })
      .then(function () { store(PENDING, pending().filter(function (x) { return x.t !== item.t; })); })
      .catch(function () {});
  });
}
function commit() {
  if (!S || S.sent || S.i < S.idx.length) return;
  S.sent = true;
  var body;
  if (PERIOD) {
    // 1 語ごと [行番号, ○=1/✕=0, 裏返すまでの ms, 決めるまでの ms]
    body = { v: 2, p: SID, id: S.id, day: KIND[S.kind], b: S.book.b, round: S.round, mode: "fsrs", started: S.started, ended: Date.now(), undo: S.undo,
             items: S.idx.map(function (wi, k) { var w = S.deck[wi]; return [w[5], S.res[k] ? 0 : 1, S.times[k] ? S.times[k][0] : 0, S.times[k] ? S.times[k][1] : 0]; }) };
  } else {
    body = { s: SID, miss: missIdx().map(function (wi) { return S.deck[wi][0]; }) };
  }
  store(PENDING, pending().concat([{ t: Date.now() + Math.random(), body: body }]));
  flush();
}
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") { commit(); saveState(); } });
flush();

// ================================================================ 読み込み
function b64u(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for (var j = 0; j < b.length; j++) u[j] = b.charCodeAt(j); return u; }
function loadLocal(id, key) {
  return fetch("d/" + id + ".txt", { cache: "no-cache" })   // 同じ QR のデータを作り直したとき古いのが出ないように
    .then(function (r) { if (!r.ok) throw new Error("nf"); return r.text(); })
    .then(function (t) {
      var raw = b64u(t.trim());
      return crypto.subtle.importKey("raw", b64u(key), "AES-GCM", false, ["decrypt"])
        .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, k, raw.slice(12)); });
    })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}
function loadApi() { return fetch(API + "?s=" + SID).then(function (r) { return r.json(); }).then(function (d) { if (!d.ok) throw new Error("nf"); return d; }); }
if (!/^[0-9a-z]{23}$/.test(SID)) {
  show("この QR のデータが見つからない。先生に知らせてね");
} else {
  screen("msg");
  (KEY ? loadLocal(SID, KEY).catch(function (e) { if (PERIOD) throw e; return loadApi(); }) : loadApi())
    .then(function (d) {
      if (PERIOD) {
        if (!d.books) { show("古い QR です。先生に新しい QR をもらってね"); return; }
        P = d;
        // 範囲の語と、前の期間の語（復習に出る）の索引
        Object.keys(P.cards || {}).forEach(function (row) { var c = P.cards[row]; INDEX[row] = [0, c[1], c[2], c[3], c[4], +row]; BOOK[row] = c[0]; });
        P.books.forEach(function (bk) { bk.words.forEach(function (w) { INDEX[w[5]] = w; BOOK[w[5]] = bk.b; }); });
        fsrsSeed(); store("cur:" + ME, { s: SID, k: KEY }); hub(); checkLatest(d.ptr); startPush(); return;
      }
      var bk = { b: SID.charAt(6), label: d.title, words: d.words };
      begin(bk, "today", d.words, 1);
    })
    .catch(function (e) { show(e && e.message === "nf" ? "この QR のデータが見つからない。先生に知らせてね" : "読み込めなかった。電波のいい所でもう一回開いてね"); });
}
