<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0a14">
<title>単語チェック</title>
<!--
  単語チェック
  - 期間の QR（?s=<期間ID>、7 文字目が p）：宿題そのもの（2026-09-15 に紙からアプリへ切り替え）。
    日の一覧 → 単語だけ見て答える → タップで裏返して訳 → ○／✕ にフリック → 何周でも（ミスだけも可）。
    1 回のセッションごとに、何周目か・1 語ごとの結果・裏返すまで／決めるまでの時間を送る。
  - 紙の QR（?s=<シートID>、7 文字目が e/k）：紙の宿題の答え合わせのあとに誤答を入れる（前からの形）。
  このページには単語も氏名も入っていない。データは暗号化して d/<ID>.txt に置き、鍵は URL の # の後ろ（サーバーに送られない）。
-->
<style>
:root{--tc:#2ee6c5;--bg:#0b0a14;--ink:#f4f3ff;--sub:#a3a0c2;--ok:#27e39a;--ng:#ff3d71;--a1:#ff4fd8;--a2:#ffb400;--a3:#5b8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);
 background:var(--bg);overscroll-behavior:none;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-2;
 background:radial-gradient(40% 35% at 15% 10%,rgba(255,79,216,.35),transparent 70%),
 radial-gradient(45% 40% at 90% 25%,rgba(91,140,255,.30),transparent 70%),
 radial-gradient(50% 45% at 50% 100%,rgba(255,180,0,.22),transparent 70%);
 animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) rotate(8deg)}}
button{font-family:inherit}

header{padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#back{display:none;border:0;background:rgba(255,255,255,.1);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800}
#title{flex:1;font-size:14px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}

/* 進み具合：覚えてた＝緑インクが左から、ミス＝ピンクインクが右から（スプラっぽく） */
#inkWrap{display:none}
.ink{position:relative;height:16px;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.08)}
.ink>div{position:absolute;top:0;bottom:0;width:0;transition:width .38s cubic-bezier(.2,1.5,.3,1)}
#inkOk{left:0;border-radius:99px 0 0 99px;background:linear-gradient(90deg,#10b877,#27e39a);box-shadow:0 0 14px rgba(39,227,154,.55)}
#inkNg{right:0;border-radius:0 99px 99px 0;background:linear-gradient(270deg,#e8266a,#ff4fd8);box-shadow:0 0 14px rgba(255,61,113,.55)}
.ink>div:after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:46% 54% 42% 58%}
#inkOk:after{right:-9px;background:#27e39a}#inkNg:after{left:-9px;background:#ff4fd8}
.ink>div.empty:after{display:none}
.splat{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;animation:splat .55s ease-out forwards}
@keyframes splat{0%{transform:translate(0,0) scale(1.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.inkNums{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;font-weight:900;font-style:italic;letter-spacing:.06em}
#nOk{color:#27e39a}#nNg{color:#ff4fd8}

#msg{display:none;text-align:center;font-size:18px;font-weight:700;padding:80px 24px;color:var(--sub)}

/* 日の一覧 */
#hub{display:none;padding:8px 18px 40px}
.hubHead{margin:6px 0 16px}
.hubHead .big{font-size:30px;font-weight:900;line-height:1.1;background:linear-gradient(90deg,var(--a2),var(--a1));
 -webkit-background-clip:text;background-clip:text;color:transparent}
.hubHead .small{margin-top:6px;font-size:13px;font-weight:700;color:var(--sub)}
.day{border-radius:20px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.08)}
.day.today{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1),0 10px 30px rgba(255,79,216,.2)}
.dayTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dayName{font-size:17px;font-weight:900}
.badge{font-size:11px;font-weight:900;letter-spacing:.1em;color:#fff;padding:3px 10px;background:var(--a1);
 clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
.books{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk{border:0;border-radius:14px;padding:12px;text-align:left;color:var(--ink);background:rgba(255,255,255,.08)}
.bk .bn{font-size:13px;font-weight:800;color:var(--sub)}
.bk .bs{margin-top:4px;font-size:18px;font-weight:900;white-space:nowrap}
.bk .br{margin-top:2px;font-size:12px;font-weight:800;color:var(--sub)}
.bk.done{background:linear-gradient(135deg,rgba(39,227,154,.28),rgba(91,140,255,.18))}
.bk.done .bs{color:#27e39a}
.bk.part{background:linear-gradient(135deg,rgba(255,180,0,.22),rgba(255,79,216,.15))}

/* カード */
#swipe{display:none;flex-direction:column;align-items:center;padding:4px 18px 24px}
.hud{width:100%;max-width:380px;display:flex;align-items:center;justify-content:space-between;height:22px}
.ticks{display:flex;gap:5px}
.tick{width:24px;height:10px;background:rgba(255,255,255,.12);clip-path:polygon(28% 0,100% 0,72% 100%,0 100%);transition:background .2s}
.tick.on{background:var(--tc);box-shadow:0 0 10px var(--tc)}
#streakNum{font-size:13px;font-weight:900;font-style:italic;letter-spacing:.14em;color:var(--tc)}
#banner{position:relative;width:100%;max-width:380px;height:62px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#banner .slab{position:absolute;left:6%;right:6%;top:6px;bottom:14px;background:var(--bc,#ff4655);clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}
#banner .slab:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.7)}
#banner .txt{position:relative;margin-top:-8px;font-size:26px;font-weight:900;font-style:italic;letter-spacing:.1em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
#banner .sub{position:absolute;bottom:0;font-size:11px;font-weight:900;letter-spacing:.35em;color:var(--bc,#ff4655)}
#banner.show{animation:slam .6s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes slam{0%{transform:scale(2.6) skewX(-14deg);opacity:0}35%{transform:scale(.9) skewX(-8deg);opacity:1}55%{transform:scale(1.06) skewX(-8deg)}100%{transform:scale(1) skewX(-8deg);opacity:1}}
#banner.out{transition:opacity .35s,transform .35s;opacity:0!important;transform:scale(.9) skewX(-8deg)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;box-shadow:inset 0 0 140px 40px var(--tc)}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#aura{position:fixed;left:-20%;right:-20%;bottom:-30%;height:70%;pointer-events:none;z-index:-1;opacity:0;
 background:radial-gradient(50% 50% at 50% 60%,var(--tc),transparent 70%);transition:opacity .5s;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
body[data-lv="1"] #aura{opacity:.18}body[data-lv="2"] #aura{opacity:.3}body[data-lv="3"] #aura{opacity:.45}body[data-lv="4"] #aura{opacity:.6}

#stage{position:relative;width:100%;max-width:380px;height:min(52vh,380px)}
.card{position:absolute;inset:0;border-radius:30px;background:#fff;color:#12101f;
 box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;
 touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;overflow:hidden}
.card.enter{animation:enter .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes enter{from{transform:scale(.9) translateY(14px);opacity:.3}to{transform:none;opacity:1}}
.card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.card .glow{position:absolute;inset:0;border-radius:30px;opacity:0;pointer-events:none}
.card .gng{background:linear-gradient(135deg,rgba(255,61,113,.55),rgba(255,79,216,.25))}
.card .gok{background:linear-gradient(135deg,rgba(39,227,154,.55),rgba(91,140,255,.2))}
.card .mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:190px;font-weight:900;line-height:1;opacity:0;pointer-events:none;text-shadow:0 0 30px rgba(255,255,255,.9)}
.card .mng{color:var(--ng)}.card .mok{color:#12c081}
.card .no{position:relative;font-size:13px;font-weight:800;color:#8b87a8;letter-spacing:.08em}
.card .word{position:relative;font-size:clamp(30px,10vw,44px);font-weight:900;letter-spacing:-.01em;text-align:center;word-break:break-word;margin-top:8px;line-height:1.1}
.card .back{position:relative;display:flex;flex-direction:column;align-items:center;min-height:86px;justify-content:flex-start}
.card .tapHint{margin-top:22px;font-size:13px;font-weight:900;letter-spacing:.12em;color:#fff;padding:8px 16px;border-radius:99px;
 background:linear-gradient(90deg,var(--a3),var(--a1));animation:hintPulse 1.4s ease-in-out infinite}
@keyframes hintPulse{50%{transform:scale(1.06)}}
.card .pos{margin-top:14px;font-size:13px;font-weight:900;color:#fff;padding:4px 12px;border-radius:99px;background:linear-gradient(90deg,var(--a3),var(--a1))}
.card .mean{margin-top:12px;font-size:18px;font-weight:700;color:#3a3752;text-align:center;line-height:1.55;animation:enter .25s ease-out}
.hint{display:flex;justify-content:space-between;width:100%;max-width:380px;margin-top:12px;font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.06em}
.btns{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:14px}
.round{border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;transition:transform .12s,opacity .2s}
.round:active{transform:scale(.88)}
.round:disabled{opacity:.28}
#bng,#bok{width:76px;height:76px;font-size:36px}
#bng{background:linear-gradient(135deg,#ff3d71,#ff4fd8);box-shadow:0 10px 26px rgba(255,61,113,.5)}
#bok{background:linear-gradient(135deg,#27e39a,#26c6ff);box-shadow:0 10px 26px rgba(39,227,154,.45)}
#bundo{width:52px;height:52px;font-size:22px;background:rgba(255,255,255,.12);color:var(--ink)}

/* 結果 */
#review{display:none;padding:8px 18px 40px}
.result{display:flex;align-items:center;gap:18px;margin:6px 0 16px}
.ring{--p:0;width:118px;height:118px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}
#score{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#outof{font-size:12px;color:var(--sub);font-weight:800}
#rank{font-size:40px;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
#rankSub{font-size:14px;font-weight:700;color:var(--sub);margin-top:6px}
#best{margin-top:8px;display:inline-block;font-size:12px;font-weight:900;font-style:italic;letter-spacing:.1em;color:#fff;padding:4px 14px;background:var(--bc,#ff4655);clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);white-space:nowrap}
#best small{font-size:10px;letter-spacing:.08em;opacity:.9;margin-left:6px}
.again{display:grid;gap:10px;margin:4px 0 18px}
.pill{border:0;border-radius:99px;padding:16px;font-size:18px;font-weight:900;color:#fff;letter-spacing:.03em}
.pill:active{transform:scale(.97)}
#againMiss{background:linear-gradient(90deg,#ff3d71,#ff4fd8);box-shadow:0 10px 26px rgba(255,61,113,.4)}
#againAll{background:linear-gradient(90deg,var(--a3),#26c6ff)}
#toHub{background:rgba(255,255,255,.1)}
.lead{font-size:13px;font-weight:800;color:var(--sub);margin:0 0 10px;letter-spacing:.04em}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
button.w{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--ink);min-height:52px;word-break:break-all}
button.w .n{font-size:11px;font-weight:800;color:var(--sub)}
button.w .t{font-size:16px;font-weight:800;margin-top:2px}
button.w .m{font-size:12px;font-weight:700;color:var(--sub);margin-top:2px}
button.w.on{background:linear-gradient(135deg,rgba(255,61,113,.35),rgba(255,79,216,.2));border-color:var(--ng)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="flash"></div><div id="aura"></div>
<header>
 <div class="top"><button id="back">← 一覧</button><div id="title">単語チェック</div><div id="count"></div></div>
 <div id="inkWrap">
  <div class="ink" id="ink"><div id="inkOk" class="empty"></div><div id="inkNg" class="empty"></div></div>
  <div class="inkNums"><span id="nOk">○ 0</span><span id="nNg">✕ 0</span></div>
 </div>
</header>
<div id="msg">読み込み中…</div>

<div id="hub"><div class="hubHead"><div class="big" id="hubBig"></div><div class="small" id="hubSmall"></div></div><div id="days"></div></div>

<div id="swipe">
 <div class="hud"><div class="ticks"><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i></div><div id="streakNum"></div></div>
 <div id="banner"><div class="slab"></div><div class="txt"></div><div class="sub"></div></div>
 <div id="stage"></div>
 <div class="hint"><span>← ミス</span><span>覚えてた →</span></div>
 <div class="btns">
  <button class="round" id="bng" aria-label="ミス">✕</button>
  <button class="round" id="bundo" aria-label="ひとつ戻す">↶</button>
  <button class="round" id="bok" aria-label="覚えてた">○</button>
 </div>
</div>

<div id="review">
 <div class="result">
  <div class="ring" id="ring"><div><div><div id="score">0</div><div id="outof"></div></div></div></div>
  <div><div id="rank"></div><div id="rankSub"></div><div id="best"></div></div>
 </div>
 <div class="again">
  <button class="pill" id="againMiss"></button>
  <button class="pill" id="againAll">もう一周</button>
  <button class="pill" id="toHub">一覧にもどる</button>
 </div>
 <p class="lead" id="listLead"></p>
 <div id="list"></div>
</div>

<script>
var API = "https://script.google.com/macros/s/AKfycbyzqMMPHQpZS9j8c3MFReDbogX0I0Rb4MFqFcuArFbUiCckxR9yFr_DtTOpj7zN7CRHYw/exec";
var SID = (new URLSearchParams(location.search).get("s") || "").trim().toLowerCase();
var KEY = new URLSearchParams(location.hash.slice(1)).get("k") || "";
var PERIOD = SID.charAt(6) === "p";      // 期間の QR（アプリで宿題）か、紙ごとの QR か
var WD = "日月火水木金土";
var P = null;                            // 読み込んだデータ
var S = null;                            // いまのセッション
var busy = false;
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function screen(id) {
  ["msg", "hub", "swipe", "review"].forEach(function (k) { $(k).style.display = "none"; });
  $(id).style.display = id === "swipe" ? "flex" : "block";
  $("inkWrap").style.display = (id === "swipe" || id === "review") ? "block" : "none";
  $("back").style.display = PERIOD && id !== "hub" && id !== "msg" ? "block" : "none";
  if (id !== "swipe") document.body.dataset.lv = 0;
}
function show(text) { screen("msg"); $("msg").textContent = text; }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function rid() { var a = new Uint8Array(9); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (x) { return ("0" + x.toString(36)).slice(-2); }).join("").slice(0, 16); }

// ================================================================ 日の一覧
function md(iso) { var d = new Date(iso + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate() + "（" + WD[d.getDay()] + "）"; }
function todayIso() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function progKey(di, bi) { return "wc:" + SID + ":" + (di + 1) + ":" + P.days[di].books[bi].b; }
function hub() {
  screen("hub"); $("title").textContent = "単語チェック"; $("count").textContent = "";
  $("hubBig").textContent = md(P.test) + " テストまで";
  $("hubSmall").textContent = "毎日1日分。先の日もできる。何周してもOK";
  var box = $("days"); box.innerHTML = ""; var today = todayIso(), scrollTo = null;
  P.days.forEach(function (day, di) {
    var card = el("div", "day" + (day.date === today ? " today" : "")), top = el("div", "dayTop");
    top.appendChild(el("div", "dayName", (di + 1) + "日目　" + md(day.date)));
    if (day.date === today) { top.appendChild(el("div", "badge", "TODAY")); scrollTo = card; }
    card.appendChild(top);
    var books = el("div", "books");
    day.books.forEach(function (bk, bi) {
      var pr = store(progKey(di, bi)), b = el("button", "bk" + (pr ? (pr.bestOk === bk.words.length ? " done" : " part") : ""));
      b.appendChild(el("div", "bn", bk.label));
      b.appendChild(el("div", "bs", pr ? ("○ " + pr.bestOk + " / " + bk.words.length) : "スタート"));
      if (pr) b.appendChild(el("div", "br", pr.rounds + "周" + (pr.bestOk === bk.words.length ? "・コンプ" : "")));
      b.onclick = function () { start(di, bi, "all"); };
      books.appendChild(b);
    });
    card.appendChild(books); box.appendChild(card);
  });
  if (scrollTo) setTimeout(function () { scrollTo.scrollIntoView({ block: "center" }); }, 50);
}
$("back").onclick = function () { commit(); hub(); };

// ================================================================ セッション
function shuffle(a) { for (var j = a.length - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[r]; a[r] = t; } return a; }
function start(di, bi, mode, only) {
  var bk = P.days[di].books[bi], pr = store(progKey(di, bi)) || { rounds: 0, bestOk: 0 };
  var idx = only ? only.slice() : bk.words.map(function (w, k) { return k; });
  var round = pr.rounds + 1;
  if (round > 1) shuffle(idx);          // 1 周目は紙と同じ順、2 周目からは混ぜる
  S = { di: di, bi: bi, mode: mode, round: round, idx: idx, i: 0, res: [], times: [], undo: 0,
        started: Date.now(), id: rid(), sent: false, shownAt: 0, flipAt: 0, flipped: false };
  $("title").textContent = (P.days.length > 1 ? (di + 1) + "日目 " : "") + bk.label + (mode === "miss" ? "　ミスだけ" : "") + "　" + round + "周目";
  screen("swipe"); streakFx(0, false); render();
}
function word() { return P.days[S.di].books[S.bi].words[S.idx[S.i]]; }
function counts() { var ok = 0, ng = 0; for (var j = 0; j < S.i; j++) { if (S.res[j]) ng++; else ok++; } return [ok, ng]; }
function progress() {
  var n = S.idx.length, c = counts();
  $("count").textContent = Math.min(S.i + 1, n) + " / " + n;
  $("inkOk").style.width = (c[0] / n * 100) + "%"; $("inkOk").classList.toggle("empty", !c[0]);
  $("inkNg").style.width = (c[1] / n * 100) + "%"; $("inkNg").classList.toggle("empty", !c[1]);
  $("nOk").textContent = "○ " + c[0]; $("nNg").textContent = "✕ " + c[1];
}
function splat(miss) {
  var n = S.idx.length, c = counts(), ink = $("ink");
  var x = miss ? (1 - c[1] / n) * ink.clientWidth : c[0] / n * ink.clientWidth, color = miss ? "#ff4fd8" : "#27e39a";
  for (var k = 0; k < 9; k++) {

function setButtons() { $("bng").disabled = $("bok").disabled = !S.flipped; $("bundo").disabled = S.i === 0; }

// 答え（品詞・訳）を出す。出すまではフリックできない（見ずに ○ を押せないように）

// ================================================================ ストリーク（ヴァロっぽく）
function streak() { var k = 0; for (var j = S.i - 1; j >= 0 && S.res[j] === false; j--) k++; return k; }

  [20, "UNSTOPPABLE", "#ff4655"], [15, "ON FIRE", "#ff7a1a"], [10, "CLUTCH", "#ffd166"], [5, "ACE", "#ff4655"],
  [4, "QUADRA KILL", "#ff7a1a"], [3, "TRIPLE KILL", "#ffd166"], [2, "DOUBLE KILL", "#2ee6c5"]];

function banner(text, sub, color) {
  var b = $("banner"); b.style.setProperty("--bc", color); b.querySelector(".txt").textContent = text; b.querySelector(".sub").textContent = sub;
  b.classList.remove("show", "out"); void b.offsetWidth; b.classList.add("show");

// ================================================================ 結果
function rankOf(p) {
  if (p >= 100) return ["神", "パーフェクト"];
  if (p >= 90) return ["えぐい", "ほぼ完璧"];
  if (p >= 75) return ["ナイス", "ミスだけ見直そ"];
  if (p >= 50) return ["伸びしろ", "ミスをもう一回"];
  return ["ここから", "ミスだけ覚えよ"];
}

function missIdx() { return S.idx.filter(function (x, k) { return S.res[k]; }); }

  $("toHub").textContent = PERIOD ? "一覧にもどる" : "送信して終わる";

// ================================================================ 読み込み
